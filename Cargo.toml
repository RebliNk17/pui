[package]
name = "pui"
default-run = "pui"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native desktop workspace for the Pi coding agent"
license = "MIT"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
fs2 = "0.4"
libc = "0.2"
notify = "8"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
pulldown-cmark = "0.13"
url = "2"
unicode-bidi = "0.3"
portable-pty = "0.9"
vt100 = "0.18"
base64 = "0.22"
arboard = { version="3.7",default-features=false,features=["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "=0.50.0", default-features = false }
svgtypes = "=0.16.2"

[[bin]]
name = "pui-browser-helper"
path = "src/browser_helper.rs"

[target.'cfg(target_os = "macos")'.dependencies]
cef = { version = "=156.4.0", default-features = false, features = ["sandbox"] }
raw-window-handle = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = {version="0.3",default-features=false,features=["std","NSEvent","NSPasteboard","NSSound","NSApplication","NSDockTile","NSMenu","NSMenuItem","NSCell","NSResponder","NSWindow","NSView","block2"]}
objc2-foundation = {version="0.3",default-features=false,features=["std","NSObject","NSString","NSError","NSBundle","NSGeometry"]}
objc2-user-notifications = {version="0.3",default-features=false,features=["std","block2","UNNotification","UNNotificationContent","UNNotificationRequest","UNNotificationResponse","UNNotificationTrigger","UNUserNotificationCenter"]}

# egui 0.32 has no bidi layout; keep the renderer/input patches together.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
egui = { path = "vendor/egui" }

[profile.release]
lto = "thin"
strip = true

[package.metadata.bundle]
name = "Pui"
identifier = "dev.pi.pui"
category = "Developer Tool"
short_description = "A native workspace for Pi"
osx_minimum_system_version = "12.0"
