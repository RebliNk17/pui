name: Android CI

on:
  push:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional version name override (e.g. 0.1.0)'
        required: false
        type: string
      publish_play_internal:
        description: 'Upload signed AAB to Google Play Internal Testing track'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Run mobile unit tests
        run: npm test

  android-build:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    needs: android-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Android version name and code
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="${INPUT_VERSION#v}"
          elif [ -n "$RELEASE_TAG" ]; then
            VER="${RELEASE_TAG#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="0.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"
          echo "Building Android versionName=${VER} versionCode=${GITHUB_RUN_NUMBER}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Decode release keystore (when configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KS_PATH="${RUNNER_TEMP}/pui-release.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS_PATH"
            echo "keystore_path=${KS_PATH}" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; falling back to debug signing."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pui-mobile-${{ hashFiles('mobile/package-lock.json', 'mobile/app.config.ts', 'mobile/plugins/*.js') }}
          restore-keys: |
            gradle-pui-mobile-

      - name: Expo prebuild Android project
        env:
          PUI_ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PUI_ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PUI_ANDROID_PACKAGE: ${{ vars.PUI_ANDROID_PACKAGE || 'com.reblink17.pui' }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Android APK (for GitHub Releases / direct install)
        working-directory: mobile/android
        env:
          PUI_ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          PUI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PUI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PUI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Android AAB (for Google Play Console)
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          PUI_ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          PUI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PUI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PUI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect APK, AAB, and checksums
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p dist-apk
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          APK_NAME="pui-android-v${VERSION_NAME}.apk"
          cp "$APK" "dist-apk/${APK_NAME}"
          (cd dist-apk && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -n 1 || true)
          if [ -n "$AAB" ]; then
            AAB_NAME="pui-android-v${VERSION_NAME}.aab"
            cp "$AAB" "dist-apk/${AAB_NAME}"
            (cd dist-apk && sha256sum "${AAB_NAME}" > "${AAB_NAME}.sha256")
          fi
          ls -lh dist-apk

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/dist-apk/*
          if-no-files-found: error
          retention-days: 14

  attach-android-apk-to-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: android-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist-apk/*.apk dist-apk/*.apk.sha256 --clobber

  publish-google-play-internal:
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_play_internal))
    needs: android-build
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist-apk

      - name: Check Google Play publish prerequisites
        id: play_ready
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          AAB=$(find dist-apk -maxdepth 1 -name '*.aab' | head -n 1 || true)
          if [ -n "$PLAY_JSON" ] && [ -n "$AAB" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "aab_path=${AAB}" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Google Play upload (requires ANDROID_KEYSTORE_BASE64 + GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secrets)."
          fi

      - name: Upload AAB to Google Play Internal Testing track
        if: steps.play_ready.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PUI_ANDROID_PACKAGE || 'com.reblink17.pui' }}
          releaseFiles: ${{ steps.play_ready.outputs.aab_path }}
          track: internal
          status: completed
