name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'mobile/**'
      - 'daemon/**'
      - '.github/workflows/android.yml'
      - 'README.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # No path filter: the required "CI result" check must report on every PR.
  # Unaffected suites are skipped by the changes job instead.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Pull requests run only the suites whose inputs changed; pushes and tags
  # (empty base) run everything, including the app bundle.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      node: ${{ steps.affected.outputs.node }}
      python: ${{ steps.affected.outputs.python }}
      package: ${{ steps.affected.outputs.package }}
      toolchain: ${{ steps.affected.outputs.toolchain }}
      mobile: ${{ steps.affected.outputs.mobile }}
      daemon: ${{ steps.affected.outputs.daemon }}
      macos: ${{ steps.affected.outputs.macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select affected suites
        id: affected
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 scripts/ci/affected.py "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

  macos-build:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUST_VERSION: "1.88.0"
      CARGO_TERM_COLOR: "always"
      CARGO_INCREMENTAL: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      PUI_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # Git integration fixtures perform offline local clones and pushes.
      # A shallow/blobless checkout can leave historical objects unavailable.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute cache fingerprints
        run: /usr/bin/python3 scripts/ci/cache-key.py

      - name: Read cache fingerprints
        id: cache-keys
        run: |
          echo "toolchain=$(cat .ci-cache/toolchain)" >> "$GITHUB_OUTPUT"
          echo "dependencies=$(cat .ci-cache/dependencies)" >> "$GITHUB_OUTPUT"
          echo "day=$(cat .ci-cache/day)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust toolchain
        id: restore-toolchain
        if: needs.changes.outputs.toolchain == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.rustup/toolchains/1.88.0-aarch64-apple-darwin
          key: rust-toolchain-v1-arm64-${{ steps.cache-keys.outputs.toolchain }}

      - name: Restore downloads and verified CEF archive
        id: restore-downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            .cargo-ci/registry
            .cargo-ci/git
            ~/.npm/_cacache
            target/cef-runtime
            target/agent-runtime-cache
          key: downloads-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}
          restore-keys: |
            downloads-v2-arm64-${{ github.ref_name }}-
            downloads-v2-arm64-

      - name: Restore compiled Rust and CEF outputs
        id: restore-compiled
        if: needs.changes.outputs.toolchain == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            target/debug
            target/release
          key: compiled-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-${{ steps.cache-keys.outputs.day }}
          restore-keys: |
            compiled-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-
            compiled-v2-arm64-master-${{ steps.cache-keys.outputs.dependencies }}-

      # No secret context: cached executables stay in this ad-hoc build job.
      # Publication runs separately without these caches or Apple credentials.
      - name: Validate affected suites (and package on push/tag)
        env:
          PUI_CI_RUST: ${{ needs.changes.outputs.rust }}
          PUI_CI_NODE: ${{ needs.changes.outputs.node }}
          PUI_CI_PYTHON: ${{ needs.changes.outputs.python }}
          PUI_CI_PACKAGE: ${{ needs.changes.outputs.package }}
        run: bash scripts/ci/github-macos.sh

      - name: Save Rust toolchain even if checks fail
        if: always() && needs.changes.outputs.toolchain == 'true' && steps.restore-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.rustup/toolchains/1.88.0-aarch64-apple-darwin
          key: rust-toolchain-v1-arm64-${{ steps.cache-keys.outputs.toolchain }}

      # Skipped for Python/Node-only runs so a cache without CEF is never saved.
      - name: Save downloads even if checks fail
        if: always() && needs.changes.outputs.toolchain == 'true' && steps.restore-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cargo-ci/registry
            .cargo-ci/git
            ~/.npm/_cacache
            target/cef-runtime
            target/agent-runtime-cache
          key: downloads-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}

      - name: Save compiled outputs (at most one snapshot per day)
        if: always() && needs.changes.outputs.toolchain == 'true' && steps.restore-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/debug
            target/release
          key: compiled-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-${{ steps.cache-keys.outputs.day }}

      - name: Upload macOS release artifacts
        if: needs.changes.outputs.package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14

  mobile-validate:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  daemon-validate:
    needs: changes
    if: needs.changes.outputs.daemon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Single required status check for branch protection. Always reports, so
  # docs-only PRs (macOS job skipped) can merge, and any failure blocks.
  ci-result:
    name: CI result
    needs: [changes, macos-build, mobile-validate, daemon-validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success or an intentional skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: value["result"] for job, value in json.loads(os.environ["RESULTS"]).items()}
          print(results)
          ok = results.get("changes") == "success" and all(r in ("success", "skipped") for r in results.values())
          sys.exit(0 if ok else 1)
          PY

  github-release:
    needs: macos-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: pui-github-releases
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: dist/releases

      - name: Verify release provenance and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT_TAG: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py check
          tag="${GITHUB_REF_NAME}"
          # macOS and Android attach to one release. It stays a draft until
          # both a .dmg and an .apk are attached; whichever workflow finishes
          # second publishes it (both jobs share the pui-github-releases group).
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag \
              --title "Pui ${tag#v}" --notes-file dist/releases/CHANGELOG.md
          fi
          gh release edit "$tag" --title "Pui ${tag#v}" --notes-file dist/releases/CHANGELOG.md
          gh release upload "$tag" dist/releases/* --clobber
          assets=$(gh release view "$tag" --json assets -q '.assets[].name')
          if grep -q '\.dmg$' <<<"$assets" && grep -q '\.apk$' <<<"$assets"; then
            gh release edit "$tag" --draft=false --latest
          else
            echo "Waiting for the Android APK before publishing $tag."
          fi
