name: macOS CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  macos-build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUST_VERSION: "1.88.0"
      CARGO_TERM_COLOR: "always"
      CARGO_INCREMENTAL: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      PUI_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # Git integration fixtures perform offline local clones and pushes.
      # A shallow/blobless checkout can leave historical objects unavailable.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute cache fingerprints
        run: /usr/bin/python3 scripts/ci/cache-key.py

      - name: Read cache fingerprints
        id: cache-keys
        run: |
          echo "toolchain=$(cat .ci-cache/toolchain)" >> "$GITHUB_OUTPUT"
          echo "dependencies=$(cat .ci-cache/dependencies)" >> "$GITHUB_OUTPUT"
          echo "day=$(cat .ci-cache/day)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust toolchain
        id: restore-toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.rustup/toolchains/1.88.0-aarch64-apple-darwin
          key: rust-toolchain-v1-arm64-${{ steps.cache-keys.outputs.toolchain }}

      - name: Restore downloads and verified CEF archive
        id: restore-downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            .cargo-ci/registry
            .cargo-ci/git
            ~/.npm/_cacache
            target/cef-runtime
            target/agent-runtime-cache
          key: downloads-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}
          restore-keys: |
            downloads-v2-arm64-${{ github.ref_name }}-
            downloads-v2-arm64-

      - name: Restore compiled Rust and CEF outputs
        id: restore-compiled
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug
            target/release
          key: compiled-v1-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-${{ steps.cache-keys.outputs.day }}
          restore-keys: |
            compiled-v1-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-
            compiled-v1-arm64-master-${{ steps.cache-keys.outputs.dependencies }}-

      # No secret context: cached executables stay in this ad-hoc build job.
      # Publication runs separately without these caches or Apple credentials.
      - name: Validate and package Apple Silicon app
        run: bash scripts/ci/github-macos.sh

      - name: Save Rust toolchain even if checks fail
        if: always() && steps.restore-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.rustup/toolchains/1.88.0-aarch64-apple-darwin
          key: rust-toolchain-v1-arm64-${{ steps.cache-keys.outputs.toolchain }}

      - name: Save downloads even if checks fail
        if: always() && steps.restore-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cargo-ci/registry
            .cargo-ci/git
            ~/.npm/_cacache
            target/cef-runtime
            target/agent-runtime-cache
          key: downloads-v2-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}

      - name: Save compiled outputs (at most one snapshot per day)
        if: always() && steps.restore-compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug
            target/release
          key: compiled-v1-arm64-${{ github.ref_name }}-${{ steps.cache-keys.outputs.dependencies }}-${{ steps.cache-keys.outputs.day }}

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: macos-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: pui-github-releases
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/releases

      - name: Verify release provenance and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT_TAG: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/release.py check
          # The Android workflow may already have created this release to
          # attach its APK; then update it instead of failing.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Pui ${GITHUB_REF_NAME#v}" \
              --notes-file dist/releases/CHANGELOG.md
            gh release upload "${GITHUB_REF_NAME}" dist/releases/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/releases/* \
              --title "Pui ${GITHUB_REF_NAME#v}" \
              --notes-file dist/releases/CHANGELOG.md \
              --verify-tag
          fi
